<form>
    <fieldset>
        <legend>Información Personal</legend>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" required>

        <label for="fecha-nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>

        <label for="gen_masculino">Masculino</label>
        <input type="radio" id="gen_masculino" name="genero" value="masculino" required>
        
        <label for="gen_femenino">Femenino</label>
        <input type="radio" id="gen_femenino" name="genero" value="femenino" required>

        <label for="gen_otro">Otro</label>
        <input type="radio" id="gen_otro" name="genero" value="otro" required>
    </fieldset>

    <fieldset>
        <legend>Información de Contacto</legend>
        <label for="email">Dirección de correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefono">Número de teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required>

        <label for="direccion">Dirección:</label>
        <textarea id="direccion" name="direccion" required></textarea>
    </fieldset>
    
    <fieldset>
        <legend>Información de Cuenta</legend>
        <label for="usuario">Nombre de usuario:</label>
        <input type="text" id="usuario" name="usuario" required>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required>

        <label for="confirmar-contrasena">Confirmar contraseña:</label>
        <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" required>
    </fieldset>

    <fieldset>
        <legend>Preferencias</legend>
        <label for="color">Seleccionar color favorito:</label>
        <select id="color" name="color">
            <option value="rojo">Rojo</option>
            <option value="verde">Verde</option>
            <option value="azul">Azul</option>
            <option value="amarillo">Amarillo</option>
        </select>

        <label for="terminos">Acepto los términos y condiciones:</label>
        <input type="checkbox" id="terminos" name="terminos" required>
</form>
